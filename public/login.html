<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>Sign in | Trade-Me</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--gold:#d7b46a;--text:#edf2f5;--muted:#89959c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#292719,transparent 48%),#080b10;color:var(--text);font-family:'DM Sans',sans-serif}.card{width:min(430px,100%);padding:clamp(25px,6vw,42px);border:1px solid #30352f;border-radius:18px;background:linear-gradient(145deg,#151c1d,#0d1318);box-shadow:0 30px 100px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:38px}.mark{width:43px;height:43px;display:grid;place-items:center;border:1px solid #77633b;border-radius:12px;color:var(--gold);font-size:25px}.brand b{display:block;font:800 18px 'Manrope',sans-serif;letter-spacing:1.8px}.brand small{display:block;margin-top:4px;color:#7e8b8e;font-size:8px;letter-spacing:1.5px}.kicker{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:2px}h1{margin:12px 0 9px;font:750 32px 'Manrope',sans-serif;letter-spacing:-1px}.intro{margin:0 0 28px;color:var(--muted);font-size:12px;line-height:1.8}label{display:block;margin-bottom:9px;color:#c4cccb;font-size:11px;font-weight:650}.field{width:100%;height:49px;padding:0 13px;border:1px solid #354147;border-radius:8px;outline:0;background:#0a1116;color:var(--text);font-size:13px}.field:focus{border-color:var(--gold)}.submit{width:100%;height:49px;margin-top:14px;border:0;border-radius:8px;background:linear-gradient(110deg,#d7b46a,#a88a4d);color:#18160f;font-size:12px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.status{display:none;margin-top:15px;padding:12px;border-radius:8px;font-size:11px;line-height:1.6}.status.show{display:block}.status.ok{border:1px solid #31664d;background:#14271d;color:#aee4c5}.status.error{border:1px solid #754044;background:#2a171a;color:#f1b0b0}.foot{margin:21px 0 0;color:#6e7b81;text-align:center;font-size:9px;line-height:1.7}</style></head><body><main class="card"><div class="brand"><span class="mark">T•</span><span><b>TRADE-ME</b><small>AI TRADING INTELLIGENCE</small></span></div><div class="kicker">SECURE ACCOUNT ACCESS</div><h1>Welcome back.</h1><p class="intro">Sign in to access your private trading analyses and saved chart history. We'll email you a secure one-time link.</p><form id="loginForm"><label for="email">Email address</label><input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com" required><button class="submit" id="submit" type="submit">Send secure sign-in link</button></form><div class="status" id="status" role="status" aria-live="polite"></div><p class="foot">Protected by Supabase authentication and row-level database security.<br>Never share your sign-in link with anyone.</p></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script>(()=>{const status=document.getElementById("status"),button=document.getElementById("submit"),show=(m,t)=>{status.textContent=m;status.className="status show "+t},config=window.TRADEME_CONFIG||{};if(!config.supabaseUrl||!config.supabasePublishableKey||!window.supabase?.createClient){show("Trade-Me sign-in is not configured. Contact the administrator.","error");button.disabled=true;return;}const client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);client.auth.getSession().then(({data,error})=>{if(error)throw error;if(data.session?.user)location.replace("/");}).catch(e=>show(e.message||"Could not check session.","error"));client.auth.onAuthStateChange((event,session)=>{if(session?.user&&["SIGNED_IN","INITIAL_SESSION","TOKEN_REFRESHED"].includes(event))location.replace("/");});document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Sending link…";try{const email=document.getElementById("email").value.trim().toLowerCase(),{error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+"/"}});if(error)throw error;show("Your secure sign-in link is on its way. Open the email on this device to access Trade-Me.","ok");button.textContent="Link sent";}catch(err){show(err.message||"Could not send your sign-in link.","error");button.disabled=false;button.textContent="Send secure sign-in link";}});})();</script></body></html>
