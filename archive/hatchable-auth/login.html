<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Aurapay-bm</title><link rel="stylesheet" href="/theme.css"><script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:22px"><section class="panel" style="width:min(430px,100%);padding:30px" x-data="authScreen()" x-init="init()"><div style="display:flex;align-items:center;gap:12px;margin-bottom:34px"><div class="brandmark">A</div><div><div style="font-weight:800;letter-spacing:-.03em;font-size:19px">aurapay<span class="gold">-bm</span></div><div class="small-label">Money, with intention.</div></div></div><div class="eyebrow">Secure access</div><h1 style="font-size:30px;letter-spacing:-.05em;margin:10px 0">Welcome back.</h1><p class="muted" style="font-size:14px;line-height:1.6;margin-bottom:25px">A calmer way to manage naira payments. Sign in with a one-time code or your device passkey.</p><form @submit.prevent="step==='email'?send():verify()"><label class="small-label" for="email">Email address</label><input class="field" style="margin:8px 0 14px" id="email" type="email" x-model="email" autocomplete="username webauthn" placeholder="you@example.com" required><template x-if="step==='code'"><div><label class="small-label" for="code">6-digit verification code</label><input class="field" style="margin:8px 0 14px;letter-spacing:.25em" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" x-model="code" placeholder="000000" required></div></template><button class="btn btn-gold" style="width:100%" type="submit" :disabled="busy" x-text="busy?'Please wait…':step==='email'?'Continue securely':'Verify and sign in'"></button></form><button x-show="step==='code'" class="btn btn-ghost" style="width:100%;margin-top:10px" @click="step='email';code=''">Use another email</button><div class="rule" style="margin:23px 0"></div><button x-show="user && offer" class="btn btn-gold" style="width:100%" @click="addPasskey()">Enable fingerprint / Face ID</button><button x-show="step==='email' && email && hatchable.auth.supportsPasskeys()" class="btn btn-ghost" style="width:100%" @click="passkey()">Use fingerprint / Face ID passkey</button><p class="muted" style="font-size:11px;line-height:1.6;text-align:center;margin:20px 0 0">Protected by email verification and device passkeys. Never share your one-time code.</p><p x-show="error" x-text="error" style="color:#ff9696;font-size:13px;margin-top:14px"></p><p x-show="user && !offer" style="color:var(--green);font-size:13px;margin-top:14px">Signed in. Opening your secure dashboard…</p></section></main><script>function authScreen(){return{email:'',code:'',step:'email',busy:false,error:'',user:null,offer:false,async init(){try{const s=await hatchable.auth.getSession();if(s&&s.user)location.replace('/')}catch(e){}},async send(){this.busy=true;this.error='';try{const r=await hatchable.auth.startLogin({email:this.email});this.hasPasskey=!!r.has_passkey;this.step='code';}catch(e){this.error=e.message||'Could not send a code. Please try again.'}finally{this.busy=false}},async verify(){this.busy=true;this.error='';try{const r=await hatchable.auth.verifyCode({email:this.email,code:this.code});this.user=r.user;this.offer=hatchable.auth.supportsPasskeys()&&!this.hasPasskey;if(!this.offer)location.replace('/')}catch(e){this.error=e.message||'That code could not be verified.'}finally{this.busy=false}},async passkey(){this.error='';try{const r=await hatchable.auth.signInWithPasskey({email:this.email});this.user=r.user;location.replace('/')}catch(e){this.error=e.message||'Passkey sign-in was cancelled.'}},async addPasskey(){try{await hatchable.auth.registerPasskey({name:'Aurapay-bm device passkey'});location.replace('/')}catch(e){this.error=e.message||'Passkey setup was not completed.'}}}}</script></body></html>
